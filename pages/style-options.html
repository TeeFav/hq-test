<title>HQ Style Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a gallery of four self-contained style cards, 2-up on wide screens, stacked on phones. Each card carries its own tokens. */
:root{
  --bg:#eef0f3; --fg:#1b1f27; --muted:#5b6372; --line:#d3d8e0; --chip:#ffffff; --sel:#2f5bd3;
  --f-ui:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--fg:#e8ebf0;--muted:#9aa3b2;--line:#2a303a;--chip:#1c2028;--sel:#7d9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161b;--fg:#e8ebf0;--muted:#9aa3b2;--line:#2a303a;--chip:#1c2028;--sel:#7d9bff;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header h1{font-size:1.6rem;margin:0;text-wrap:balance}
header p{margin:.25rem 0 0;color:var(--muted);max-width:62ch}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg span{color:var(--muted);font-size:.85rem;margin-right:4px}
.seg button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--sel);color:var(--sel);font-weight:700}
.seg button:focus-visible,.card button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.label b{font-size:1.05rem}.label small{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem}

/* shared card skeleton; every color comes from the card's own tokens */
.card{background:var(--c-bg);color:var(--c-fg);padding:18px;display:grid;gap:14px;min-width:0}
.card .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted)}
.task{background:var(--c-surface);border:var(--c-border);padding:14px;display:grid;gap:10px}
.task h3{margin:0;font-size:1.08rem;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--c-muted)}
.due{color:var(--c-warn);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{min-height:40px;min-width:40px;padding:0 12px;font:inherit;font-size:.85rem;cursor:pointer;background:transparent;color:var(--c-fg);border:1px solid var(--c-line)}
.btns .primary{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.tl{display:grid;gap:6px}
.ticks{display:grid;grid-template-columns:repeat(8,1fr);font-size:.7rem;color:var(--c-muted);font-variant-numeric:tabular-nums}
.lane{position:relative;height:30px;background:var(--c-track);overflow:hidden}
.bar{position:absolute;top:5px;bottom:5px;display:flex;align-items:center;padding:0 8px;font-size:.72rem;white-space:nowrap;overflow:hidden}
.bar.prep{left:12.5%;width:50%;background:var(--c-accent);color:var(--c-on-accent)}
.bar.trip{left:75%;width:25%;background:var(--c-accent2);color:var(--c-on-accent2)}
.today{position:absolute;top:0;bottom:0;left:31%;width:2px;background:var(--c-today)}
.today::after{content:"today";position:absolute;top:-1px;left:4px;font-size:.62rem;color:var(--c-today);font-weight:700}

/* A — Boarding pass */
.s-pass{--c-bg:#f3f5f8;--c-fg:#14213a;--c-muted:#5a6680;--c-surface:#ffffff;--c-line:#c5cdda;--c-border:1px dashed #b8c2d3;--c-accent:#1f3a6b;--c-on-accent:#ffffff;--c-accent2:#f2b632;--c-on-accent2:#1d1600;--c-warn:#b5480f;--c-track:#e3e8ef;--c-today:#c2410c;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;border-radius:4px}
.s-pass .task{border-radius:4px;position:relative}
.s-pass .meta,.s-pass .ticks{font-family:"IBM Plex Mono",ui-monospace,monospace}
.s-pass h3{text-transform:uppercase;letter-spacing:.02em}
.s-pass .btns button{border-radius:3px}
/* B — Topo field map */
.s-topo{--c-bg:#e7ece4;--c-fg:#1e2a22;--c-muted:#58665c;--c-surface:#f6f8f3;--c-line:#b9c5b8;--c-border:1px solid #c9d3c6;--c-accent:#2e6b4f;--c-on-accent:#f3fbf6;--c-accent2:#8a6a2c;--c-on-accent2:#fff8ea;--c-warn:#a33d2b;--c-track:#d6ded2;--c-today:#a33d2b;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;border-radius:18px;
  background-image:repeating-radial-gradient(circle at 85% 10%,transparent 0 14px,color-mix(in srgb,var(--c-line) 45%,transparent) 14px 15px);background-color:var(--c-bg)}
.s-topo .task{border-radius:14px}
.s-topo h3{font-weight:800}
.s-topo .btns button{border-radius:999px}
.s-topo .lane,.s-topo .bar{border-radius:999px}
/* C — Transit map */
.s-transit{--c-bg:#ffffff;--c-fg:#111418;--c-muted:#5d6670;--c-surface:#f4f6f8;--c-line:#cfd5dc;--c-border:none;--c-accent:#0b7d8c;--c-on-accent:#ffffff;--c-accent2:#c2187a;--c-on-accent2:#ffffff;--c-warn:#d14b00;--c-track:#eceff2;--c-today:#111418;
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;border-radius:10px;border:1px solid var(--c-line)}
.s-transit .task{border-radius:10px;border-left:6px solid var(--c-accent)}
.s-transit .btns button{border-radius:8px}
.s-transit .lane{height:14px;margin:8px 0;border-radius:7px;overflow:visible}
.s-transit .bar{top:0;bottom:0;border-radius:7px;font-size:0;padding:0}
.s-transit .bar::before,.s-transit .bar::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--c-bg);border:3px solid currentColor;box-sizing:border-box}
.s-transit .bar.prep{color:var(--c-accent)}.s-transit .bar.trip{color:var(--c-accent2)}
.s-transit .bar::before{left:-2px}.s-transit .bar::after{right:-2px}
.s-transit .today{top:-8px;bottom:-8px}.s-transit .today::after{top:-14px}
/* D — Riso postcard */
.s-riso{--c-bg:#f7f3f6;--c-fg:#1d1a33;--c-muted:#5c5874;--c-surface:#ffffff;--c-line:#1d1a33;--c-border:2px solid #1d1a33;--c-accent:#ff4f8b;--c-on-accent:#1d1a33;--c-accent2:#3d5afe;--c-on-accent2:#ffffff;--c-warn:#d4004f;--c-track:#ece6f0;--c-today:#1d1a33;
  font-family:"Work Sans",system-ui,sans-serif;border-radius:0}
.s-riso h3{font-family:"Archivo Black",system-ui,sans-serif;font-weight:400;text-shadow:2px 2px 0 color-mix(in srgb,var(--c-accent) 55%,transparent)}
.s-riso .task{box-shadow:5px 5px 0 var(--c-accent2)}
.s-riso .btns button{border-width:2px;border-radius:0}
.s-riso .bar{border:2px solid var(--c-line)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  .s-pass{--c-bg:#0f1726;--c-fg:#e6ecf7;--c-muted:#93a1bb;--c-surface:#16213a;--c-line:#33405c;--c-border:1px dashed #3b4968;--c-accent:#8fb0ff;--c-on-accent:#0b1222;--c-accent2:#f2b632;--c-warn:#ff9a62;--c-track:#1d2944;--c-today:#ff9a62}
  .s-topo{--c-bg:#151c17;--c-fg:#e3ebe2;--c-muted:#9aab9d;--c-surface:#1d2620;--c-line:#34433a;--c-border:1px solid #2e3b33;--c-accent:#6fc59a;--c-on-accent:#0d1a13;--c-accent2:#d6b26a;--c-on-accent2:#1d1500;--c-warn:#ff8c78;--c-track:#25302a;--c-today:#ff8c78}
  .s-transit{--c-bg:#101317;--c-fg:#eef1f4;--c-muted:#9aa4ae;--c-surface:#181c21;--c-line:#2c333b;--c-accent:#39c3d4;--c-on-accent:#04191c;--c-accent2:#ff5cb1;--c-on-accent2:#24001a;--c-warn:#ff8a3d;--c-track:#20262d;--c-today:#eef1f4}
  .s-riso{--c-bg:#1a1729;--c-fg:#f4eff8;--c-muted:#b1abc6;--c-surface:#231f37;--c-line:#f4eff8;--c-border:2px solid #f4eff8;--c-accent:#ff6f9f;--c-on-accent:#1a1729;--c-accent2:#6f86ff;--c-on-accent2:#0e0f2a;--c-warn:#ff6f9f;--c-track:#2b2642;--c-today:#f4eff8}
}}
:root[data-theme="dark"]{
  .s-pass{--c-bg:#0f1726;--c-fg:#e6ecf7;--c-muted:#93a1bb;--c-surface:#16213a;--c-line:#33405c;--c-border:1px dashed #3b4968;--c-accent:#8fb0ff;--c-on-accent:#0b1222;--c-accent2:#f2b632;--c-warn:#ff9a62;--c-track:#1d2944;--c-today:#ff9a62}
  .s-topo{--c-bg:#151c17;--c-fg:#e3ebe2;--c-muted:#9aab9d;--c-surface:#1d2620;--c-line:#34433a;--c-border:1px solid #2e3b33;--c-accent:#6fc59a;--c-on-accent:#0d1a13;--c-accent2:#d6b26a;--c-on-accent2:#1d1500;--c-warn:#ff8c78;--c-track:#25302a;--c-today:#ff8c78}
  .s-transit{--c-bg:#101317;--c-fg:#eef1f4;--c-muted:#9aa4ae;--c-surface:#181c21;--c-line:#2c333b;--c-accent:#39c3d4;--c-on-accent:#04191c;--c-accent2:#ff5cb1;--c-on-accent2:#24001a;--c-warn:#ff8a3d;--c-track:#20262d;--c-today:#eef1f4}
  .s-riso{--c-bg:#1a1729;--c-fg:#f4eff8;--c-muted:#b1abc6;--c-surface:#231f37;--c-line:#f4eff8;--c-border:2px solid #f4eff8;--c-accent:#ff6f9f;--c-on-accent:#1a1729;--c-accent2:#6f86ff;--c-on-accent2:#0e0f2a;--c-warn:#ff6f9f;--c-track:#2b2642;--c-today:#f4eff8}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Pick a look for your tracker pages</h1>
    <p>Each card shows the same sample task and a sample timeline bar. The data is made up for the preview. Your real pages start empty.</p>
  </header>
  <div class="seg" role="group" aria-label="Preview theme">
    <span>Preview in:</span>
    <button id="t-sys" aria-pressed="true" data-t="">Phone setting</button>
    <button id="t-light" aria-pressed="false" data-t="light">Light</button>
    <button id="t-dark" aria-pressed="false" data-t="dark">Dark</button>
  </div>

  <div class="grid" id="cards"></div>
  <p class="note">Tell Claude the letter you like (A–D), or mix them, for example "B colors with C's timeline".</p>
</div>

<template id="tpl">
  <div>
    <div class="label"><b></b><small></small></div>
    <section class="card">
      <div class="eyebrow">Sample · Before departure</div>
      <div class="task">
        <h3>Renew passport</h3>
        <div class="meta"><span>Trip: Sample trip</span><span>Owner: You</span><span class="due">Due in 6 weeks</span></div>
        <div class="btns">
          <button class="primary" type="button">Done</button>
          <button type="button" aria-label="Move up">↑</button>
          <button type="button" aria-label="Move down">↓</button>
          <button type="button">Group</button>
          <button type="button">Delete</button>
        </div>
      </div>
      <div class="tl">
        <div class="ticks"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span><span>W7</span><span>W8</span></div>
        <div class="lane"><div class="bar prep">Passport renewal</div><div class="bar trip">Trip</div><div class="today"></div></div>
      </div>
    </section>
  </div>
</template>

<script>
const styles=[
  ["s-pass","A · Boarding pass","Crisp, monospace details, navy + amber"],
  ["s-topo","B · Topo field map","Soft rounded, forest green, contour lines"],
  ["s-transit","C · Transit map","Clean and high-contrast, timeline as a route line"],
  ["s-riso","D · Riso postcard","Bold print look, pink + blue, offset shadows"]
];
const tpl=document.getElementById("tpl"),cards=document.getElementById("cards");
for(const [cls,name,desc] of styles){
  const n=tpl.content.cloneNode(true);
  n.querySelector(".label b").textContent=name;
  n.querySelector(".label small").textContent=desc;
  n.querySelector(".card").classList.add(cls);
  cards.appendChild(n);
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  const t=b.dataset.t;
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
}));
</script>
